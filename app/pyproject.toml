[project]
name = "scamshield"
version = "0.1.0"
description = "ScamShield Africa: fraud intelligence network (pilot MVP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "pillow>=10.4",
  "cryptography>=43",
  "idna>=3.7",
  "segno>=1.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "mypy", "pip-audit", "bandit", "playwright", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scamshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' -p no:warnings"
markers = ["e2e: browser end-to-end tests (need Chromium)"]

[tool.coverage.run]
branch = true
source = ["scamshield"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]  # E501: long lines accepted (no formatter enforced); S101: asserts used for type narrowing
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"evaluation/*" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = []

[tool.bandit]
# B101: assert is used only to narrow Optional types on invariants guaranteed by foreign keys / earlier checks.
skips = ["B101"]
