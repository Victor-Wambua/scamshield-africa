{% extends 'base.html' %}{% from 'macros.html' import csrf_field, field_error with context %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div style="max-width:460px;margin:0 auto"><h1>Choose a new password</h1>
{{ field_error(errors, 'token') }}
<form method="post" action="/reset/{{ token }}" class="stack">{{ csrf_field() }}<div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">{{ field_error(errors, 'password') }}</div><button class="btn block" type="submit">Change password</button></form></div>
{% endblock %}
